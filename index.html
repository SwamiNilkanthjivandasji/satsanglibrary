<!DOCTYPE html>
<html lang="gu" data-theme="sepia">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>સત્સંગ પુસ્તકાલય</title>
  <meta name="description" content="શ્રી સ્વામિનારાયણ સંપ્રદાયના આધ્યાત્મિક ગ્રંથોનું ડિજિટલ ગ્રંથાલય">
  <meta name="theme-color" content="#c85a17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="સત્સંગ પુસ્તકાલય">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Serif+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    /* થીમ પહેલેથી લાગુ કરો, જેથી પેજ ખૂલતાં રંગ ઝબકે નહીં */
    try { var t = localStorage.getItem('sp.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- આઇકન (એક જ વાર, બધે <use> થી વપરાય છે) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></symbol>
      <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
      <symbol id="i-coffee" viewBox="0 0 24 24"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></symbol>
      <symbol id="i-library" viewBox="0 0 24 24"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/></symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></symbol>
    </defs>
  </svg>

  <a class="skip-link" href="#view">મુખ્ય સામગ્રી પર જાઓ</a>
  <div class="accent-bar" aria-hidden="true"></div>

  <header class="app-header">
    <div class="container app-header__row">
      <a class="brand" href="#/" aria-label="સત્સંગ પુસ્તકાલય, મુખ્ય પાનું">
        <span class="brand__mark"><svg class="icon" aria-hidden="true"><use href="#i-book-open"/></svg></span>
        <span class="brand__name">સત્સંગ પુસ્તકાલય</span>
      </a>
      <div class="app-header__tools">
        <span id="offline-badge" class="chip chip--muted" hidden>ઓફલાઇન</span>
        <button id="btn-install" class="btn btn--soft btn--sm" type="button" hidden>
          <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg><span>એપ ઇન્સ્ટોલ</span>
        </button>
        <div class="segmented" role="group" aria-label="થીમ">
          <button type="button" data-theme-btn="light" aria-pressed="false" aria-label="લાઇટ મોડ" title="લાઇટ"><svg class="icon" aria-hidden="true"><use href="#i-sun"/></svg></button>
          <button type="button" data-theme-btn="sepia" aria-pressed="true" aria-label="સેપિયા મોડ" title="સેપિયા"><svg class="icon" aria-hidden="true"><use href="#i-coffee"/></svg></button>
          <button type="button" data-theme-btn="dark" aria-pressed="false" aria-label="ડાર્ક મોડ" title="ડાર્ક"><svg class="icon" aria-hidden="true"><use href="#i-moon"/></svg></button>
        </div>
      </div>
    </div>

    <div class="subbar">
      <div class="container subbar__row">
        <nav id="breadcrumbs" class="crumbs" aria-label="તમે અહીં છો"></nav>
        <div id="search-container" class="search">
          <svg class="icon search__icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="search-input" class="search__input" type="search" placeholder="પુસ્તક અથવા પ્રકરણ શોધો…" autocomplete="off" aria-label="શોધો">
          <button id="clear-search" class="search__clear" type="button" aria-label="શોધ સાફ કરો" hidden><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
        </div>
      </div>
    </div>
  </header>

  <main class="container main">
    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <svg class="icon" aria-hidden="true"><use href="#i-check-circle"/></svg>
      <p id="toast-message"></p>
      <button type="button" data-action="hide-toast" aria-label="બંધ કરો"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
    </div>
    <div id="view" class="view" tabindex="-1">
      <noscript><p class="panel panel--center">આ એપ ચલાવવા માટે JavaScript ચાલુ હોવું જરૂરી છે.</p></noscript>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__row">
      <p>સત્સંગ પુસ્તકાલય • ડિજિટલ ગ્રંથાલય</p>
      <p>શ્રી સ્વામિનારાયણ સંપ્રદાયના આધ્યાત્મિક ગ્રંથો</p>
    </div>
  </footer>

  <dialog id="install-dialog" class="dialog" aria-labelledby="install-title">
    <h3 id="install-title">એપ તરીકે ઇન્સ્ટોલ કરો</h3>
    <ol>
      <li>iPhone / iPad માં Safari ખોલીને નીચે <strong>Share (શેર)</strong> બટન દબાવો.</li>
      <li><strong>“Add to Home Screen”</strong> પસંદ કરો.</li>
      <li>ઉપર જમણી બાજુ <strong>“Add”</strong> દબાવો.</li>
    </ol>
    <button class="btn btn--primary btn--block" type="button" data-close>સમજાઈ ગયું</button>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
